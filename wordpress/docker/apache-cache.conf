# Browser caching for static files, so a page view doesn't re-request every asset.
# Theme and core files are versioned only by the theme version, which isn't bumped
# on every deploy: keep them an hour, then refresh in the background. Uploads never
# change in place (WordPress renames a re-uploaded file): keep them 30 days.
#
# Staging (BZ_NOINDEX set) is behind basic auth, so its files are "private": a
# shared cache like Cloudflare must not keep them and serve them without the password.
<If "%{REQUEST_URI} =~ m#^/wp-(content/(themes|plugins)|includes)/.+\.(css|js|woff2?|svg|png|jpe?g|gif|webp|ico)$#">
	Header set Cache-Control "private, max-age=3600, stale-while-revalidate=86400" "expr=-n env('BZ_NOINDEX')"
	Header set Cache-Control "public, max-age=3600, stale-while-revalidate=86400" "expr=-z env('BZ_NOINDEX')"
</If>
<ElseIf "%{REQUEST_URI} =~ m#^/wp-content/uploads/.+\.(png|jpe?g|gif|webp|svg|pdf)$#">
	Header set Cache-Control "private, max-age=2592000" "expr=-n env('BZ_NOINDEX')"
	Header set Cache-Control "public, max-age=2592000" "expr=-z env('BZ_NOINDEX')"
</ElseIf>
